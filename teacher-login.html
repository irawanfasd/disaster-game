<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Login Guru — Disaster Zone</title>
<link rel="stylesheet" href="/style.css?v=10">
<link rel="stylesheet" href="/animations.css">
<script src="/theme.js?v=10"></script>
<style>
.login-wrap{max-width:460px;margin:40px auto;padding:20px}
.login-box{background:#fff;border:3px solid #001a3a;box-shadow:6px 6px 0 #001a3a;padding:30px;text-align:center}
.login-box h1{font-size:20px;color:#003060;margin:0 0 6px}
.login-box .sub{color:#00a99d;font-size:11px;margin-bottom:24px}
.login-box .emoji{font-size:56px;margin-bottom:16px;display:block}
.login-box input{width:100%;padding:14px;font-size:15px;border:3px solid #001a3a;margin-bottom:12px;text-align:center;font-family:inherit}
.login-box input#otp{font-size:32px;letter-spacing:12px;font-weight:700}
.login-box button{width:100%;padding:14px;background:#2fb35a;color:#fff;border:3px solid #001a3a;box-shadow:3px 3px 0 #001a3a;font-size:14px;font-weight:700;cursor:pointer;text-transform:uppercase;margin-bottom:8px}
.login-box button.secondary{background:#fff;color:#001a3a}
.login-box button:disabled{opacity:.5;cursor:not-allowed}
.msg{padding:10px;margin:12px 0;font-size:13px;border-radius:4px;display:none}
.msg.ok{background:#d9f5e2;color:#1a5c2e;display:block}
.msg.err{background:#fdd;color:#a00;display:block}
.msg.info{background:#dbeafe;color:#1e40af;display:block}
.step{display:none}.step.active{display:block}
.email-badge{display:inline-block;padding:4px 12px;background:#e9f7ee;color:#1a5c2e;border-radius:20px;font-size:12px;margin-bottom:16px}
</style>
<script>
// === TURNSTILE CALLBACK (sebelum widget load) ===
window.__turnstileToken = '';
window.onTurnstileSuccess = function(token){
  console.log('[TURNSTILE] Success, token length:', (token || '').length);
  window.__turnstileToken = token;
  var btn = document.getElementById('btn-request');
  if(btn){ btn.disabled = false; btn.style.opacity = '1'; }
};
window.onTurnstileError = function(code){
  console.error('[TURNSTILE] Error:', code);
};
window.onTurnstileExpired = function(){
  console.warn('[TURNSTILE] Expired');
  window.__turnstileToken = '';
  var btn = document.getElementById('btn-request');
  if(btn){ btn.disabled = true; btn.style.opacity = '0.5'; }
};
</script>
<script src="/ui.js?v=12"></script>
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer data-cfasync="false"></script>
</head>
<body>
<div class="login-wrap">
<div class="login-box">
<span class="emoji">🔐</span>
<h1>Login Guru</h1>
<div class="sub">DISASTER ZONE</div>

<div id="step1" class="step active">
<p style="font-size:13px;color:#666;margin-bottom:16px">Masukkan email guru untuk menerima kode login</p>
<input type="email" id="email" placeholder="email@sekolah.sch.id" autocomplete="email">
<div class="cf-turnstile" data-sitekey="0x4AAAAAAFP62dLBh1EEGr0H" data-callback="onTurnstileSuccess" data-theme="light" style="margin-bottom:12px"></div>
<button id="btn-request">Kirim Kode Login</button>
<div id="msg1" class="msg"></div>
</div>

<div id="step2" class="step">
<div class="email-badge" id="email-display">-</div>
<p style="font-size:13px;color:#666;margin-bottom:16px">Kode dikirim ke email. Cek inbox (atau Spam). Berlaku 10 menit.</p>
<input type="text" id="otp" placeholder="000000" maxlength="6" inputmode="numeric" autocomplete="one-time-code">
<button id="btn-verify">Masuk</button>
<button class="secondary" id="btn-back">&larr; Ganti Email</button>
<button class="secondary" id="btn-resend" disabled>Kirim Ulang (60s)</button>
<div id="msg2" class="msg"></div>
</div>

<div id="step3" class="step">
<span class="emoji">&#9989;</span>
<h2 style="color:#2fb35a">Berhasil!</h2>
<p style="font-size:13px;color:#666">Mengarahkan...</p>
</div>
</div>
<div style="text-align:center;margin-top:20px;font-size:11px;color:#8696a0">
<a href="/" style="color:#00a99d">&larr; Kembali ke Game</a>
    &nbsp;·&nbsp;
    <a href="/disaster-zone.apk" download style="color:#00a99d">⬇️ Unduh APK</a>
</div>
</div>
<script>
var $=function(s){return document.querySelector(s)};
var currentEmail='',resendTimer=null;

function showStep(n){['step1','step2','step3'].forEach(function(id,i){$('#'+id).classList.toggle('active',i===n-1)})}
function setMsg(id,text,type){var el=$('#'+id);el.textContent=text;el.className='msg '+type}

fetch('/api/auth/me').then(function(r){return r.json()}).then(function(d){
  if(d.ok){setMsg('msg1','Sudah login sebagai '+d.email+'. Mengarahkan...','info');setTimeout(function(){location.href='/teacher'},1500)}
}).catch(function(){});

$('#btn-request').onclick=async function(){
  // Cek token Turnstile dulu
  var tk = window.__turnstileToken;
  if(!tk){
    var inp = document.querySelector('[name="cf-turnstile-response"]');
    if(inp && inp.value) tk = inp.value;
  }
  if(!tk){
    return setMsg('msg1','Centang Turnstile dulu (kotak Success!)','err');
  }
  window.__turnstileToken = tk;
  var email=$('#email').value.trim().toLowerCase();
  if(!email)return setMsg('msg1','Masukkan email','err');
  if(!/^[^@]+@[^@]+\.[^@]+$/.test(email))return setMsg('msg1','Format email tidak valid','err');
  var btn=$('#btn-request');window.dzLoading(btn, 'Mengirim...');
  setMsg('msg1','Mengirim kode...','info');
  try{
    var r=await fetch('/api/auth/request-otp',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:email,'cf-turnstile-response':window.__turnstileToken||''})}).then(function(r){return r.json()});
    if(r.ok){currentEmail=email;$('#email-display').textContent=email;showStep(2);$('#otp').focus();startResendTimer()}
    else setMsg('msg1',r.error||'Gagal','err');
  }catch(e){setMsg('msg1','Error: '+e.message,'err')}
  finally{
    btn.disabled=false;
    btn.textContent='Kirim Kode Login';
    if(window.turnstile)try{window.turnstile.reset()}catch(e){}
  }
};

$('#btn-verify').onclick=async function(){
  var code=$('#otp').value.trim();
  if(code.length!==6)return setMsg('msg2','Kode harus 6 digit','err');
  var btn=$('#btn-verify');window.dzLoading(btn, 'Verifikasi...');
  try{
    var r=await fetch('/api/auth/verify-otp',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:currentEmail,code:code})}).then(function(r){return r.json()});
    if(r.ok){showStep(3);setTimeout(function(){location.href='/teacher'},1000)}
    else{setMsg('msg2',r.error||'Kode salah','err');$('#otp').value='';$('#otp').focus()}
  }catch(e){setMsg('msg2','Error: '+e.message,'err')}
  finally{window.dzLoaded(btn)}
};

$('#email').addEventListener('keypress',function(e){if(e.key==='Enter')$('#btn-request').click()});
$('#otp').addEventListener('keypress',function(e){if(e.key==='Enter')$('#btn-verify').click()});
$('#otp').addEventListener('input',function(e){e.target.value=e.target.value.replace(/\D/g,'').slice(0,6)});
$('#btn-back').onclick=function(){showStep(1);$('#otp').value='';$('#msg1').className='msg'};

function startResendTimer(){
  var btn=$('#btn-resend');var s=60;btn.disabled=true;btn.textContent='Kirim Ulang ('+s+'s)';
  clearInterval(resendTimer);
  resendTimer=setInterval(function(){s--;if(s<=0){clearInterval(resendTimer);btn.disabled=false;btn.textContent='Kirim Ulang'}else btn.textContent='Kirim Ulang ('+s+'s)'},1000)
}
$('#btn-resend').onclick=async function(){
  if(!currentEmail)return;var btn=$('#btn-resend');btn.disabled=true;
  try{
    var r=await fetch('/api/auth/request-otp',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:currentEmail})}).then(function(r){return r.json()});
    if(r.ok){setMsg('msg2','Kode baru terkirim!','ok');startResendTimer()}
    else{setMsg('msg2',r.error||'Gagal','err');btn.disabled=false}
  }catch(e){setMsg('msg2','Error: '+e.message,'err');btn.disabled=false}
};
</script>
<script>
// === POLLING FALLBACK (kalau callback tidak jalan) ===
(function(){
  var log = 0;
  var timer = setInterval(function(){
    var btn = document.getElementById('btn-request');
    if(!btn) return;
    if(!btn.disabled) { clearInterval(timer); return; }
    var input = document.querySelector('[name="cf-turnstile-response"]');
    if(input && input.value){
      if(log++ < 3) console.log('[TURNSTILE] Token via polling, length:', input.value.length);
      window.__turnstileToken = input.value;
      btn.disabled = false;
      btn.style.opacity = '1';
      clearInterval(timer);
    }
  }, 300);
  setTimeout(function(){ clearInterval(timer) }, 90000);
})();
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function() {
    navigator.serviceWorker.register('/sw.js', { scope: '/' }).catch(function(){});
  });
}
</script>
</body>
</html>
