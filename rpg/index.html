<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Disaster Zone RPG</title>
<link rel="icon" href="/icon-192.png">
<style>
  html, body { margin: 0; height: 100%; background: #1b1b2f; overflow: hidden; touch-action: none; font-family: monospace; }
  #wrap { display: flex; align-items: center; justify-content: center; height: 100%; }
  canvas { width: 100%; max-width: 960px; image-rendering: pixelated; background: #000; border: 4px solid #444; }
  #info { position: fixed; top: 10px; left: 10px; color: #fff; font-size: 12px; background: rgba(0,0,0,0.5); padding: 6px 10px; border-radius: 4px; }
  #joy { position: fixed; left: 24px; bottom: 24px; width: 120px; height: 120px; border-radius: 50%; background: rgba(255,255,255,.15); border: 2px solid rgba(255,255,255,.4); display: none; touch-action: none; }
  #knob { position: absolute; left: 35px; top: 35px; width: 50px; height: 50px; border-radius: 50%; background: rgba(255,255,255,.5); pointer-events: none; }
  @media (pointer: coarse) { #joy { display: block; } }
</style>
</head>
<body>
<div id="info">🎮 <span id="status">Loading...</span></div>
<div id="wrap"><canvas id="game"></canvas></div>
<div id="joy"><div id="knob"></div></div>

<script src="world.js"></script>
<script src="sprites-char.js"></script>
<script src="player.js"></script>
<script src="socket.io.min.js"></script>
<script src="network.js"></script>
<script src="npc.js"></script>
<script src="chat.js"></script>
<script src="engine.js"></script>
<script src="hud.js"></script>
<script src="audio.js"></script>
<script src="quake.js"></script>
<script src="trigger-btn.js"></script>
</body>
</html>
